<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دكان | DOKAN</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
scroll-behavior:smooth;
}

body{
background:#f4f7fb;
color:#111827;
overflow-x:hidden;
transition:.4s;
}

body.dark{
background:#070b17;
color:white;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
background:black;
z-index:999999;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

/* SIDEBAR */

.sidebar{
position:fixed;
right:0;
top:0;
width:280px;
height:100vh;
background:rgba(255,255,255,.8);
backdrop-filter:blur(25px);
padding:25px;
overflow:auto;
z-index:1000;
border-left:1px solid rgba(0,0,0,.08);
transition:.4s;
}

body.dark .sidebar{
background:rgba(12,15,28,.9);
border-color:rgba(255,255,255,.08);
}

.logo{
display:flex;
align-items:center;
gap:10px;
margin-bottom:35px;
}

.logo img{
width:55px;
height:55px;
}

.logo h1{
font-size:34px;
font-weight:900;
background:linear-gradient(45deg,#00bfff,#7c3aed);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.side-title{
font-size:18px;
margin-bottom:15px;
font-weight:800;
opacity:.7;
}

.side-links{
display:flex;
flex-direction:column;
gap:12px;
}

.side-links a{
padding:15px;
border-radius:18px;
text-decoration:none;
background:white;
color:#111;
font-weight:700;
transition:.3s;
box-shadow:0 5px 20px rgba(0,0,0,.06);
}

body.dark .side-links a{
background:#111827;
color:white;
}

.side-links a:hover{
transform:translateX(-5px);
background:linear-gradient(45deg,#00bfff,#7c3aed);
color:white;
}

.toggle{
margin-top:25px;
width:100%;
height:58px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#00bfff,#7c3aed);
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}

/* MAIN */

.main{
margin-right:280px;
padding:25px;
}

/* HERO */

.hero{
height:420px;
border-radius:35px;
overflow:hidden;
position:relative;
box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.slide{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
opacity:0;
transition:1s;
transform:scale(1.1);
}

.slide.active{
opacity:1;
transform:scale(1);
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to left,rgba(0,0,0,.7),rgba(0,0,0,.2));
display:flex;
flex-direction:column;
justify-content:center;
padding:60px;
color:white;
}

.overlay h2{
font-size:65px;
max-width:600px;
font-weight:900;
line-height:1.2;
}

.overlay p{
margin-top:15px;
font-size:20px;
max-width:500px;
line-height:1.8;
}

.overlay button{
margin-top:25px;
width:200px;
height:60px;
border:none;
border-radius:18px;
background:white;
font-size:18px;
font-weight:800;
cursor:pointer;
}

/* SECTION */

.section-title{
font-size:38px;
font-weight:900;
margin:50px 0 25px;
}

/* CATEGORIES */

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.cat{
height:120px;
border-radius:28px;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:900;
color:white;
text-decoration:none;
background:linear-gradient(135deg,#00bfff,#7c3aed);
transition:.4s;
box-shadow:0 15px 40px rgba(0,191,255,.25);
}

.cat:hover{
transform:translateY(-10px);
}

/* STORES */

.stores{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
padding-bottom:50px;
}

.store{
background:rgba(255,255,255,.7);
backdrop-filter:blur(20px);
border-radius:30px;
overflow:hidden;
text-decoration:none;
color:inherit;
transition:.4s;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

body.dark .store{
background:rgba(17,24,39,.8);
}

.store:hover{
transform:translateY(-12px);
}

.store img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:18px;
}

.info h3{
font-size:24px;
margin-bottom:10px;
}

.info p{
opacity:.7;
line-height:1.8;
}

/* MOBILE */

.menu-btn{
display:none;
}

@media(max-width:991px){

.sidebar{
right:-100%;
}

.sidebar.active{
right:0;
}

.main{
margin-right:0;
}

.menu-btn{
display:flex;
position:fixed;
top:20px;
right:20px;
width:55px;
height:55px;
background:linear-gradient(45deg,#00bfff,#7c3aed);
border:none;
border-radius:18px;
z-index:9999;
color:white;
font-size:24px;
justify-content:center;
align-items:center;
cursor:pointer;
}

.overlay h2{
font-size:42px;
}

.hero{
height:320px;
}

}

</style>

</head>

<body>

<!-- INTRO -->

<div id="intro">

<video autoplay muted playsinline>

<source src="https://adelabdulrahman026-byte.github.io/DOKAN/Dokan_logo_animation_shopping_bags_202605150149.mp4">

</video>

</div>

<!-- MOBILE BUTTON -->

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<div class="logo">

<img src="https://adelabdulrahman026-byte.github.io/DOKAN/ChatGPT%20Image%20May%2015,%202026,%2012_33_56%20AM.png">

<h1>دكان</h1>

</div>

<div class="side-title">الأقسام</div>

<div class="side-links" id="sideCategories"></div>

<div class="side-title" style="margin-top:30px;">المحلات</div>

<div class="side-links" id="sideStores"></div>

<button class="toggle" onclick="toggleMode()">
🌙 / ☀️
</button>

</div>

<!-- MAIN -->

<div class="main">

<!-- HERO -->

<section class="hero">

<div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=2070')"></div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae?q=80&w=2070')"></div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=2070')"></div>

<div class="overlay">

<h2>دكان يخليك تشتري أي حاجة بسهولة</h2>

<p>

كل المحلات والأقسام في مكان واحد بتصميم عصري رهيب

</p>

<button>ابدأ الآن</button>

</div>

</section>

<!-- CATEGORIES -->

<h2 class="section-title">الأقسام</h2>

<div class="categories" id="categories"></div>

<!-- STORES -->

<h2 class="section-title">المحلات</h2>

<div class="stores" id="stores"></div>

</div>

<script>

/* INTRO */

setTimeout(()=>{

document.getElementById("intro").style.display="none";

},5000);

/* DARK MODE */

function toggleMode(){

document.body.classList.toggle("dark");

}

/* SIDEBAR */

function toggleSidebar(){

document.getElementById("sidebar").classList.toggle("active");

}

/* SLIDER */

let slides=document.querySelectorAll(".slide");

let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},5000);

/* GOOGLE SHEETS */

const SHEET_ID="1SPPwtrCVHbkzbHYYjYcRNC7SO85x69BU7f1evH1bD98";

const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

async function loadData(){

const response=await fetch(SHEET_URL);

const text=await response.text();

const json=JSON.parse(text.substr(47).slice(0,-2));

const rows=json.table.rows;

document.getElementById("categories").innerHTML="";

document.getElementById("stores").innerHTML="";

document.getElementById("sideCategories").innerHTML="";

document.getElementById("sideStores").innerHTML="";

rows.forEach(row=>{

const type=row.c[0]?.v || "";

const name=row.c[1]?.v || "";

const desc=row.c[2]?.v || "";

const img=row.c[3]?.v || "";

const link=row.c[4]?.v || "#";

/* CATEGORY */

if(type==="قسم"){

document.getElementById("categories").innerHTML+=`

<a class="cat" href="${link}">

${name}

</a>

`;

document.getElementById("sideCategories").innerHTML+=`

<a href="${link}">

${name}

</a>

`;

}

/* STORE */

if(type==="محل"){

document.getElementById("stores").innerHTML+=`

<a class="store" href="${link}" target="_blank">

<img src="${img}">

<div class="info">

<h3>${name}</h3>

<p>${desc}</p>

</div>

</a>

`;

document.getElementById("sideStores").innerHTML+=`

<a href="${link}" target="_blank">

${name}

</a>

`;

}

});

}

loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
