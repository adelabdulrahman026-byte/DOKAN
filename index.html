<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم | دكان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#050816;
padding:40px;
color:white;
}

h1{
font-size:45px;
margin-bottom:30px;
}

.box{
background:#111827;
padding:30px;
border-radius:30px;
margin-bottom:30px;
}

input,select{

width:100%;
height:60px;
margin-top:15px;
border:none;
border-radius:18px;
padding:15px;
font-size:18px;
background:#1f2937;
color:white;

}

button{

width:100%;
height:60px;
margin-top:20px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:700;
background:linear-gradient(45deg,#00d0ff,#7c3aed);
color:white;
cursor:pointer;

}

</style>
</head>

<body>

<h1>لوحة تحكم دكان</h1>

<div class="box">

<h2>إضافة قسم</h2>

<input type="text" id="catName" placeholder="اسم القسم">

<button onclick="addCategory()">إضافة القسم</button>

</div>

<div class="box">

<h2>إضافة محل</h2>

<input type="text" id="storeName" placeholder="اسم المحل">

<input type="text" id="storeDesc" placeholder="وصف المحل">

<input type="text" id="storeImg" placeholder="لينك صورة المحل">

<button onclick="addStore()">إضافة المحل</button>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycby250bHqn-6vyqA6AT4OytbwYi_5MRmhq9ZEZ2f2TPTyG_zIVNY2g3aYuqrXCb6KBWW/exec";

/* ADD CATEGORY */

async function addCategory(){

let name=document.getElementById("catName").value;

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
type:"قسم",
name:name
})
});

alert("تم إضافة القسم");

}

/* ADD STORE */

async function addStore(){

let name=document.getElementById("storeName").value;

let desc=document.getElementById("storeDesc").value;

let img=document.getElementById("storeImg").value;

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
type:"محل",
name:name,
desc:desc,
img:img
})
});

alert("تم إضافة المحل");

}

</script>

</body>
</html>
