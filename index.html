<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دكان | DOKAN</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#050816;
overflow-x:hidden;
color:white;
transition:.4s;
}

body.light{
background:#f5f5f5;
color:#111;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#00d0ff;
border-radius:20px;
}

#intro{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
}

#intro video{
width:250px;
}

.navbar{
position:fixed;
top:0;
width:100%;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(20px);
background:rgba(0,0,0,.35);
z-index:999;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:60px;
height:60px;
object-fit:contain;
}

.logo h1{
font-size:32px;
font-weight:900;
background:linear-gradient(45deg,#00d0ff,#7c3aed);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.toggle{
width:55px;
height:55px;
border-radius:50%;
border:none;
background:linear-gradient(45deg,#00d0ff,#7c3aed);
font-size:20px;
cursor:pointer;
color:white;
}

.hero{
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

.slide{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
opacity:0;
transition:1s;
transform:scale(1.1);
}

.slide.active{
opacity:1;
transform:scale(1);
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.2));
display:flex;
flex-direction:column;
justify-content:center;
padding:7%;
}

.overlay h2{
font-size:80px;
max-width:700px;
line-height:1.2;
font-weight:900;
}

.overlay p{
margin-top:20px;
font-size:22px;
max-width:550px;
opacity:.9;
}

.overlay button{
margin-top:30px;
width:220px;
height:65px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#00d0ff,#7c3aed);
font-size:20px;
font-weight:700;
cursor:pointer;
color:white;
box-shadow:0 10px 40px rgba(0,208,255,.4);
}

.section-title{
font-size:45px;
font-weight:900;
margin:70px 5% 30px;
}

.categories{
display:flex;
gap:20px;
padding:0 5%;
overflow:auto;
}

.cat{
min-width:260px;
height:130px;
border-radius:28px;
background:linear-gradient(145deg,#00d0ff,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:800;
transition:.4s;
cursor:pointer;
}

.cat:hover{
transform:translateY(-10px) scale(1.03);
}

.stores{
padding:0 5% 70px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.store{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
overflow:hidden;
backdrop-filter:blur(10px);
transition:.4s;
}

.store:hover{
transform:translateY(-10px);
}

.store img{
width:100%;
height:230px;
object-fit:cover;
}

.info{
padding:18px;
}

.info h3{
font-size:24px;
margin-bottom:10px;
}

.info p{
opacity:.7;
line-height:1.7;
}

footer{
padding:40px;
text-align:center;
background:#02030a;
opacity:.7;
}

@media(max-width:768px){

.overlay h2{
font-size:45px;
}

.overlay p{
font-size:17px;
}

.section-title{
font-size:32px;
}

}

</style>
</head>
<body>

<div id="intro">
<video autoplay muted playsinline>
<source src="https://adelabdulrahman026-byte.github.io/DOKAN/Dokan_logo_animation_shopping_bags_202605150149.mp4">
</video>
</div>

<nav class="navbar">

<div class="logo">
<img src="https://adelabdulrahman026-byte.github.io/DOKAN/ChatGPT%20Image%20May%2015,%202026,%2012_33_56%20AM.png">
<h1>دكان</h1>
</div>

<button class="toggle" onclick="toggleMode()">☀️</button>

</nav>

<section class="hero">

<div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=2070')"></div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae?q=80&w=2070')"></div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=2070')"></div>

<div class="overlay">

<h2>اشتري أي حاجة من دكان</h2>

<p>
من السوبر ماركت للملابس والاكسسوارات والديكور وكل اللي نفسك فيه
</p>

<button>ابدأ التسوق</button>

</div>

</section>

<h2 class="section-title">الأقسام</h2>

<div class="categories" id="categories"></div>

<h2 class="section-title">المحلات</h2>

<div class="stores" id="stores"></div>

<footer>
DOKAN © 2026
</footer>

<script>

/* INTRO */

setTimeout(()=>{
document.getElementById("intro").style.display="none";
},2000);

/* DARK MODE */

function toggleMode(){
document.body.classList.toggle("light");
}

/* SLIDER */

let slides=document.querySelectorAll(".slide");
let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},5000);

/* GOOGLE SHEETS */

const SHEET_ID="1SPPwtrCVHbkzbHYYjYcRNC7SO85x69BU7f1evH1bD98";

const API_KEY="YOUR_GOOGLE_API_KEY";

async function loadData(){

const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/الورقة1?key=${API_KEY}`;

const res=await fetch(url);

const data=await res.json();

const rows=data.values;

rows.shift();

rows.forEach(row=>{

const type=row[0];

if(type=="قسم"){

document.getElementById("categories").innerHTML+=`
<div class="cat">${row[1]}</div>
`;

}

if(type=="محل"){

document.getElementById("stores").innerHTML+=`

<div class="store">

<img src="${row[3]}">

<div class="info">

<h3>${row[1]}</h3>

<p>${row[2]}</p>

</div>

</div>

`;

}

});

}

loadData();

</script>

</body>
</html>
